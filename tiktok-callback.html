<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Authorization — PlotFact</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#eee;margin:0;padding:32px}main{max-width:760px;margin:auto}code{display:block;overflow-wrap:anywhere;background:#222;padding:14px;border-radius:8px;margin:8px 0 16px}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}small{color:#aaa}.ok{color:#8fd694}.err{color:#ff8b8b}</style></head><body><main><h1>PlotFact TikTok authorization</h1><p id="status">Reading TikTok authorization response…</p><div id="success" hidden><p>Authorization code:</p><code id="code"></code><button id="copy">Copy code</button><p>State:</p><code id="state"></code><p><small>This page does not exchange or store TikTok tokens. The authorization code is short-lived and should be exchanged server-side immediately.</small></p></div><div id="failure" hidden><p>Error:</p><code id="error"></code><p>Description:</p><code id="errorDescription"></code></div></main><script>const p=new URLSearchParams(location.search);const code=p.get('code');const state=p.get('state')||'';const err=p.get('error');const desc=p.get('error_description')||'';const status=document.getElementById('status');if(code){status.textContent='Authorization received successfully.';status.className='ok';document.getElementById('success').hidden=false;document.getElementById('code').textContent=code;document.getElementById('state').textContent=state;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(code);document.getElementById('copy').textContent='Copied';};}else{status.textContent='TikTok did not return an authorization code.';status.className='err';document.getElementById('failure').hidden=false;document.getElementById('error').textContent=err||'missing_code';document.getElementById('errorDescription').textContent=desc||'No authorization code was returned.';}</script></body></html>
